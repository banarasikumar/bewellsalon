name: Build Native Android Apps

# Trigger the workflow manually via the GitHub Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🏗️ Setup Native Offline Fallbacks
        run: |
          mkdir -p build
          cp -r static/* build/
          touch build/index.html
          mkdir -p apps/staff-app/android/app/src/main/assets
          mkdir -p apps/admin-app/android/app/src/main/assets

      - name: 🔄 Sync Capacitor Shells
        run: |
          npm run cap:sync:staff
          npm run cap:sync:admin

      - name: 📱 Build Staff APK (Release)
        run: |
          cd apps/staff-app/android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: 📱 Build Admin APK (Release)
        run: |
          cd apps/admin-app/android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: 🔐 Sign Release APKs
        run: |
          # Use Android Build Tools from GitHub Runner
          export APKSIGNER=$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner

          # Use the permanent keystore committed in the repo
          export KS="bewell.keystore"
          export KS_ALIAS="bewell"
          export KS_PASS="blancbeu123"

          # Output the SHA-1 and SHA-256 for Firebase & Deep-Link Configuration
          keytool -list -v -keystore $KS -alias $KS_ALIAS -storepass "$KS_PASS" | grep -E "SHA1:|SHA256:" > sha_fingerprints.txt

          # Sign the Staff APK
          $APKSIGNER sign --ks $KS --ks-key-alias $KS_ALIAS --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --out apps/staff-app/android/app/build/outputs/apk/release/BeWell-Staff.apk apps/staff-app/android/app/build/outputs/apk/release/app-release-unsigned.apk

          # Sign the Admin APK
          $APKSIGNER sign --ks $KS --ks-key-alias $KS_ALIAS --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --out apps/admin-app/android/app/build/outputs/apk/release/BeWell-Admin.apk apps/admin-app/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 📤 Upload Staff APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeWell-Staff-APK
          path: apps/staff-app/android/app/build/outputs/apk/release/BeWell-Staff.apk

      - name: 📤 Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeWell-Admin-APK
          path: apps/admin-app/android/app/build/outputs/apk/release/BeWell-Admin.apk

      - name: 📤 Upload Keystore Details
        uses: actions/upload-artifact@v4
        with:
          name: BeWell-Keystore-Details
          path: |
            bewell.keystore
            sha_fingerprints.txt

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 'BeWell Release v1.0.${{ github.run_number }}'
          body: 'Automated build release containing standalone APKs.'
          prerelease: true
          files: |
            apps/staff-app/android/app/build/outputs/apk/release/BeWell-Staff.apk
            apps/admin-app/android/app/build/outputs/apk/release/BeWell-Admin.apk
